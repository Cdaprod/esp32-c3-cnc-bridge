name: MPG motion admission tests
on:
  push:
    branches: [main, feature/wireless-mpg-jogging]
  pull_request:
jobs:
  c-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test receiver motion logic
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/mpg_motion.c tests/mpg_motion_test.c -o /tmp/mpg_motion_test
          /tmp/mpg_motion_test
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/mpg_grbl_ack.c tests/mpg_grbl_ack_test.c -o /tmp/mpg_grbl_ack_test
          /tmp/mpg_grbl_ack_test
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/mpg_uart_arbiter.c tests/mpg_uart_arbiter_test.c -o /tmp/mpg_uart_arbiter_test
          /tmp/mpg_uart_arbiter_test
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/espnow_decode.c src/mpg_motion.c src/mpg_grbl_status.c tests/espnow_interop_test.c -o /tmp/espnow_interop_test
          /tmp/espnow_interop_test
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/mpg_grbl_status.c tests/mpg_grbl_status_test.c -o /tmp/mpg_grbl_status_test
          /tmp/mpg_grbl_status_test
      - name: Verify unsafe ESP-NOW UART forwarding remains disabled
        run: |
          python3 tests/test_uart_command_gate.py
          python3 tests/test_mpg_stop_gate.py
          python3 tests/test_mpg_feed_hold_gate.py
          python3 tests/test_grbl_ack_wiring.py
          python3 tests/test_uart_console_separation.py
          python3 tests/test_mpg_pair_sequence_baseline.py
          python3 tests/test_pair_ack_contract.py

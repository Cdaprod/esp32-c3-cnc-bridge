name: ESP-IDF C3 firmware build
on:
  push:
    branches: [feature/wireless-mpg-jogging]
  pull_request:
jobs:
  esp-idf-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build XIAO ESP32-C3 firmware (motion disabled)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
          grep -q '^CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y$' sdkconfig
          grep -q '^# CONFIG_MPG_ENABLE_MOTION is not set$' sdkconfig
      - name: Compile experimental motion-enabled configuration (CI only)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D SDKCONFIG=sdkconfig.mpg-ci -D SDKCONFIG_DEFAULTS=tests/sdkconfig.mpg-ci.defaults build
          grep -q '^CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y$' sdkconfig.mpg-ci
      - name: Compile disarmed diagnostic dry-run configuration
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D SDKCONFIG=sdkconfig.mpg-dryrun-ci -D SDKCONFIG_DEFAULTS=tests/sdkconfig.mpg-dryrun.defaults build
          grep -q '^CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y$' sdkconfig.mpg-dryrun-ci
          grep -q '^# CONFIG_MPG_ENABLE_MOTION is not set$' sdkconfig.mpg-dryrun-ci
      - name: Compile explicitly gated UART motion path (CI only; never flash)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D SDKCONFIG=sdkconfig.mpg-uart-ci -D SDKCONFIG_DEFAULTS=tests/sdkconfig.mpg-uart-ci.defaults build
          grep -q '^CONFIG_MPG_ENABLE_MOTION=y$' sdkconfig.mpg-uart-ci
          grep -q '^# CONFIG_MPG_DRY_RUN is not set$' sdkconfig.mpg-uart-ci

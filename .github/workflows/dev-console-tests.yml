name: CNC MPG development console tests
on:
  push:
    branches: [feature/unified-cnc-mpg-console]
  pull_request:
    paths:
      - 'tools/cnc_mpg_console/**'
      - '.github/workflows/dev-console-tests.yml'
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'tools/cnc_mpg_console[test]'
      - run: python -m pytest -q tools/cnc_mpg_console/tests
